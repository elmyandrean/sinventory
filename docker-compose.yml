services:
  sinventory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sinventory_app
    restart: unless-stopped
    ports:
      - "8086:80"
    volumes:
      - ./storage/app:/var/www/html/storage/app
      - ./database/database.sqlite:/var/www/html/database/database.sqlite
      - ./.env:/var/www/html/.env
